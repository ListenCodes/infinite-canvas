name: Docs Docker image

on:
  workflow_call:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/listencodes/infinite-canvas-docs

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  meta:
    needs: release-gate
    runs-on: ubuntu-latest
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=

  build:
    needs: [release-gate, meta]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./docs/Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ needs.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docs-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=docs-${{ matrix.arch }}

      - name: Export digest
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docs-digests-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs:
      - meta
      - build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: docs-digests-*
          merge-multiple: true

      - name: Create multi-arch manifest
        shell: bash
        run: |
          mapfile -t digest_files < <(find "$RUNNER_TEMP/digests" -type f -printf '%f\n' | sort)
          test "${#digest_files[@]}" -eq 2
          digest_args=()
          for digest_file in "${digest_files[@]}"; do
            [[ "$digest_file" =~ ^[a-f0-9]{64}$ ]]
            digest_args+=("${IMAGE_NAME}@sha256:${digest_file}")
          done
          candidate="${IMAGE_NAME}:candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker buildx imagetools create -t "$candidate" "${digest_args[@]}"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -er '.digest')"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          promote_immutable() {
            local target="$1"
            if docker buildx imagetools inspect "$target" >/dev/null 2>&1; then
              test "$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')" = "$digest"
            else
              docker buildx imagetools create -t "$target" "${IMAGE_NAME}@${digest}"
            fi
            test "$(docker buildx imagetools inspect "$target" --format '{{json .Manifest}}' | jq -er '.digest')" = "$digest"
          }
          promote_immutable "${IMAGE_NAME}:sha-${GITHUB_SHA}"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            promote_immutable "${IMAGE_NAME}:${GITHUB_REF_NAME}"
          fi
