name: Publish Official Plugins

# 构建官方插件并把产物(bundle + 清单)强推到孤儿分支 plugins-dist。
# 与 github-pages.yml 一致,在打版本 tag 时触发 —— 发版时 web 与官方插件一起发布。
# 前端经 jsDelivr 从该分支远程拉取;构建产物不进 main、不进 git。
on:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: publish-plugins
  cancel-in-progress: false

jobs:
  release-gate:
    uses: ./.github/workflows/release-gate.yml

  publish:
    needs: release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0

      - name: Install build dependencies
        working-directory: plugins/canvas/registry
        run: npm ci --no-audit --no-fund

      - name: Build official plugins
        working-directory: plugins/canvas/registry
        run: npm run build

      - name: Publish to plugins-dist branch without history rewrite
        shell: bash
        run: |
          git fetch origin plugins-dist
          git worktree add "$RUNNER_TEMP/plugins-dist" origin/plugins-dist
          rsync -a --delete --exclude .git/ plugins/canvas/registry/dist/ "$RUNNER_TEMP/plugins-dist/"
          git -C "$RUNNER_TEMP/plugins-dist" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/plugins-dist" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/plugins-dist" add -A
          git -C "$RUNNER_TEMP/plugins-dist" diff --cached --quiet || git -C "$RUNNER_TEMP/plugins-dist" commit -m "publish official plugins @ ${GITHUB_SHA::7}"
          git -C "$RUNNER_TEMP/plugins-dist" push origin HEAD:plugins-dist
