services:
  worker:
    image: ${WORKER_OLD_IMAGE:?immutable-digest-required}
    environment:
      OUTBOX_DISPATCHER_ENABLED: ${WORKER_OLD_DISPATCHER_ENABLED:?required}
      UNKNOWN_RECONCILER_ENABLED: ${WORKER_OLD_RECONCILER_ENABLED:?required}
    labels:
      infinite-canvas.revision-role: old
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8733/health').then(r=>r.json()).then(v=>{if(v.status!=='HEALTHY')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker-new:
    profiles: ["application"]
    image: ${WORKER_NEW_IMAGE:?immutable-digest-required}
    restart: unless-stopped
    depends_on:
      hatchet-engine: { condition: service_healthy }
      hatchet-dashboard: { condition: service_healthy }
    environment:
      NODE_ENV: production
      BUSINESS_DATABASE_URL: ${BUSINESS_DATABASE_URL_WORKER:?required}
      SUPABASE_URL: ${SUPABASE_URL:?required}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      HATCHET_MODE: oss
      HATCHET_CLIENT_TOKEN: ${HATCHET_CLIENT_TOKEN:?required}
      HATCHET_CLIENT_HOST_PORT: hatchet-engine:7070
      HATCHET_CLIENT_API_URL: http://hatchet-dashboard
      HATCHET_CLIENT_TLS_STRATEGY: none
      HATCHET_NAMESPACE: ${HATCHET_NAMESPACE:-infinite-canvas}
      WORKER_HEALTH_PORT: 8733
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY:?required}
      S3_REGION: ${S3_REGION:?required}
      S3_ENDPOINT: ${S3_ENDPOINT:?required}
      S3_BUCKET: ${S3_BUCKET:?required}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?required}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?required}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      OUTBOX_DISPATCHER_ENABLED: ${WORKER_NEW_DISPATCHER_ENABLED:?required}
      UNKNOWN_RECONCILER_ENABLED: ${WORKER_NEW_RECONCILER_ENABLED:?required}
    labels:
      infinite-canvas.revision-role: new
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=2g"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    stop_grace_period: 50m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8733/health').then(r=>r.json()).then(v=>{if(v.status!=='HEALTHY')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    networks: [app-backend]
