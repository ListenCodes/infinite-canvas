global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: infinite-canvas-api
    authorization:
      type: Bearer
      credentials_file: /run/secrets/api_metrics_bearer_token
    static_configs:
      - targets: ["api:3001"]
  - job_name: infinite-canvas-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:9464"]
  - job_name: hatchet-worker-sdk
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:8733"]
